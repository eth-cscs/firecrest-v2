networks:
  firecrest-internal-v2:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.240.0/24

secrets:
  service_account_client_secret:
    file: ./build/secrets/client_secret
  s3_secret_access_key:
    file: ./build/secrets/s3_secret_access_key
  ssh_private_key_fireuser:
    file: ./build/environment/keys/fireuser-key
  ssh_private_key_firesrv:
    file: ./build/environment/keys/firesrv-key
  ssh_passphrase_firesrv:
    file: ./build/environment/keys/firesrv-passphrase


services:
  firecrest:
    image: firecrestv2
    secrets:
      - service_account_client_secret
      - s3_secret_access_key
      - ssh_private_key_fireuser
      - ssh_private_key_firesrv
      - ssh_passphrase_firesrv
    environment:
      ENVIRONMENT: development
      SSH_KEYGEN_URL: http://192.168.240.20:5000
      YAML_CONFIG_FILE: "/app/config/app-config.yaml"
    depends_on:
      keycloak:
        condition: service_healthy
      slurm:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    build:
      context: ./
      args:
        ENVIRONMENT: development
      dockerfile: ./build/docker/firecrest-api/Dockerfile
    command:
      [
        "sh",
        "-c",
        "python3 -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn firecrest.main:app --host 0.0.0.0 --port 5000 --reload --reload-dir /app/firecrest --reload-dir /app/lib",
      ]
    volumes:
      - ./src/firecrest:/app/firecrest
      - ./src/lib:/app/lib
      - ./f7t-api-config.local-env.yaml:/app/config/app-config.yaml
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.10
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:8000:5000"
      - "${F7T_HOST_IP:-127.0.0.1}:5678:5678"
      

  slurm:
    image: slurm
    privileged: true
    environment:
      OIDC_CERT_URLS: '["http://192.168.240.3:8080/auth/realms/kcrealm/protocol/openid-connect/certs"]'
    depends_on:
      keycloak:
        condition: service_healthy
    build:
      platforms:
        - linux/amd64
        - linux/arm64
      context: ./
      dockerfile: ./build/docker/slurm-cluster/Dockerfile
    hostname: slurm
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.2
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:6820:6820"
      - "${F7T_HOST_IP:-127.0.0.1}:2222:22"
      - "${F7T_HOST_IP:-127.0.0.1}:5665:5665"
      - "${F7T_HOST_IP:-127.0.0.1}:5666:5666"
    volumes:
        # ssh config
        - ./build/docker/slurm-cluster/ssh/sshd_config_base:/etc/ssh/sshd_config
        - ./src/firecrest-streamer:/app/firecrest-streamer
    healthcheck:
        test: ["CMD", "scontrol", "ping"]
        interval: 1s
        timeout: 2s
        retries: 30

  pbs:
    image: openpbs:23.06.06
    privileged: true
    environment:
      PBS_START_MOM: "1"
    build:
      platforms:
        - linux/amd64
        - linux/arm64
      context: ./
      dockerfile: ./build/docker/pbs-cluster/Dockerfile
    hostname: pbs
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.4
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:15001:15001"   # PBS Server Port
      - "${F7T_HOST_IP:-127.0.0.1}:15002:15002"   # PBS Scheduler Port
      - "${F7T_HOST_IP:-127.0.0.1}:15003:15003"   # PBS Communication Manager
      - "${F7T_HOST_IP:-127.0.0.1}:2223:22"       # SSH Access
    volumes:
        # ssh config
        - ./build/docker/pbs-cluster/ssh/sshd_config_base:/etc/ssh/sshd_config
    healthcheck:
        test: ["CMD", "pbsnodes", "-a"]
        interval: 1s
        timeout: 2s
        retries: 30

  # complementary 3rd party services
  keycloak:
    image: "quay.io/keycloak/keycloak:26.0.7"
    env_file: ./build/docker/keycloak/keycloak.env
    command: start-dev --http-relative-path /auth --import-realm --health-enabled=true --metrics-enabled=true
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.3
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:8080:8080"
      - "${F7T_HOST_IP:-127.0.0.1}:9090:9000"
    volumes:
      - ./build/docker/keycloak/config.json:/opt/keycloak/data/import/config.json:ro
      - ./build/logs/keycloak:/opt/jboss/keycloak/standalone/log/:delegated
    healthcheck:
        # curl no longer available in recent versions (see https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07 for alternatives)
        test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
        interval: 1s
        timeout: 2s
        retries: 30

  keycloak-create-user:
     image: "quay.io/keycloak/keycloak:26.0.7"
     depends_on:
        keycloak:
          condition: service_healthy
     restart: "no"
     networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.55
     volumes:
       - ./build/docker/keycloak/config.json:/opt/keycloak/data/import/config.json:ro
     entrypoint: ["/bin/sh", "-c" , "/opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080/auth/ --realm master --user admin --password admin2 && /opt/keycloak/bin/kcadm.sh create users -r kcrealm -s username=fireuser -s enabled=true && /opt/keycloak/bin/kcadm.sh set-password -r kcrealm --username fireuser -p password"]

  # S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: storage_access_key
      RUSTFS_SECRET_KEY: storage_secret_key
      # OIDC support settings
      RUSTFS_IDENTITY_WEBIDENTITY_ENABLE: on
      RUSTFS_IDENTITY_WEBIDENTITY_CONFIG_URL: "http://keycloak:8080/realms/kcrealm/.well-known/openid-configuration"
      RUSTFS_IDENTITY_WEBIDENTITY_CLIENT_ID: "firecrest-s3-client"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: "http://keycloak"
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.19
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:9000:9000"
      - "${F7T_HOST_IP:-127.0.0.1}:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 1s
      timeout: 2s
      retries: 30

  rustfs-setup:
    image: rustfs/rc:v0.1.36
    container_name: rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./build/docker/rustfs/bucket-policy.json:/bucket-policy.json:ro
    entrypoint: >
      /bin/sh -c "
        echo 'Connect to RustFS'
        rc alias set local http://rustfs:9000 storage_access_key storage_secret_key

        echo 'Create buckets for users'
        rc mb local/fireuser --ignore-existing
        rc mb local/firesrv  --ignore-existing

        echo 'Load generic bucket policy'
        rc admin policy create local policy-user-bucket /bucket-policy.json || true

        echo 'Create local users'
        rc admin user add local fireuser 'fireuser_fs_password' || true
        rc admin user add local firesrv  'firesrv_fs_password'  || true

        echo 'Set policy to users'
        rc admin policy attach local policy-user-bucket --user fireuser
        rc admin policy attach local policy-user-bucket --user firesrv

        echo 'Generate keys'
        rc admin service-account create local 'fireuser_access_key' 'fireuser_secret_key' --user fireuser || true
        rc admin service-account create local 'firesrv_access_key'  'firesrv_secret_key'  --user firesrv  || true
        echo 'done'
      "
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.119
    
  # mount on cluster
  # s3fs fireuser /s3/fireuser -o passwd_file=/etc/s3fs/s3fs_creds_fireuser -o url=http://rustfs:9000 -o use_path_request_style -o allow_other -o uid=1001 -o gid=1001 -o umask=0006
  # s3fs firesrv /s3/firesrv -o passwd_file=/etc/s3fs/s3fs_creds_firesrv -o url=http://rustfs:9000 -o use_path_request_style -o allow_other -o uid=1002 -o gid=1002 -o umask=0006

  ssh-ca:
    image: deic-sshca
    depends_on:
      keycloak:
        condition: service_healthy
    build:
      context: ./
      args:
        ENVIRONMENT: development
      dockerfile: ./build/docker/deic-sshca/Dockerfile
    networks:
      firecrest-internal-v2:
        ipv4_address: 192.168.240.22
    ports:
      - "${F7T_HOST_IP:-127.0.0.1}:2221:2221"
      - "${F7T_HOST_IP:-127.0.0.1}:2280:2280"

volumes:
  rustfs-data:
