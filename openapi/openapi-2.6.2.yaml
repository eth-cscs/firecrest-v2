  /compute/{system_name}/jobs:
    post:
      tags:
      - compute
      summary: Post Job Submit
      description: Submit a new job
      operationId: post_job_submit_compute__system_name__jobs_post
      security:
      - APIAuthDependency: []
      - HTTPBearer: []
      parameters:
      - name: system_name
        in: path
        required: true
        schema:
          type: string
          title: System Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostJobSubmitRequest'
      responses:
        '201':
          description: Job submitted correctly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostJobSubmissionResponse'
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
          description: Server Error
    get:
      tags:
      - compute
      summary: Get Jobs
      description: Get status of all jobs
      operationId: get_jobs_compute__system_name__jobs_get
      security:
      - APIAuthDependency: []
      - HTTPBearer: []
      parameters:
      - name: system_name
        in: path
        required: true
        schema:
          type: string
          title: System Name
      - name: allusers
        in: query
        required: false
        schema:
          type: boolean
          description: If set to `true` returns all jobs visible by the current user,
            otherwise only the current user owned jobs
          default: false
          title: Allusers
        description: If set to `true` returns all jobs visible by the current user,
          otherwise only the current user owned jobs
      - name: account
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: If specified, filter jobs by account name
          title: Account
        description: If specified, filter jobs by account name
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 235
          - type: 'null'
          description: If specified, filter jobs by name
          title: Name
        description: If specified, filter jobs by name
      - name: time_window
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobsTimeWindow'
          description: 'Time window used to look back for historical (completed, failed,
            cancelled...) jobs. Does not affect currently pending or running jobs,
            which are always returned. Not supported for PBS clusters: the parameter
            is accepted but has no effect, and job history visibility there is bounded
            by the scheduler''s own configuration instead'
          default: 24h
        description: 'Time window used to look back for historical (completed, failed,
          cancelled...) jobs. Does not affect currently pending or running jobs, which
          are always returned. Not supported for PBS clusters: the parameter is accepted
          but has no effect, and job history visibility there is bounded by the scheduler''s
          own configuration instead'
      responses:
        '200':
          description: Jobs status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobResponse'
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
          description: Server Error
