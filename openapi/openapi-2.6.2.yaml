      - APIAuthDependency: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9]+$
          description: Job id
          title: Job Id
        description: Job id
      - name: system_name
        in: path
        required: true
        schema:
          type: string
          title: System Name
      responses:
        '204':
          description: Job cancelled successfully
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
          description: Client Error
        5XX:
