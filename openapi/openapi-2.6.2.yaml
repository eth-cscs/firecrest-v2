components:
  schemas:
    AccountsModel:
      properties:
        name:
          type: string
          title: Name
        default:
          type: boolean
          title: Default
      type: object
      required:
      - name
      - default
      title: AccountsModel
    ApResponseErrorType:
      type: string
      enum:
      - error
      - validation
      title: ApResponseErrorType
    ApiResponseError:
      properties:
        errorType:
          $ref: '#/components/schemas/ApResponseErrorType'
          default: error
        message:
          type: string
          title: Message
        causedBy:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Causedby
          nullable: true
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          nullable: true
        user:
          anyOf:
          - type: string
          - type: 'null'
          title: User
          nullable: true
      type: object
      required:
      - message
      title: ApiResponseError
    BackendServiceType:
      type: string
      enum:
      - s3
      - filesystem
      - ssh
      - scheduler
      - exception
      title: BackendServiceType
      description: Types of services that can be health-checked.
    Body_post_upload_filesystem__system_name__ops_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: File to be uploaded as `multipart/form-data`
      type: object
      required:
      - file
      title: Body_post_upload_filesystem__system_name__ops_upload_post
    BucketLifecycleConfiguration:
      properties:
        days:
          type: integer
          title: Days
          description: Number of days after which objects will expire automatically.
          default: 10
      type: object
      title: BucketLifecycleConfiguration
      description: Configuration for automatic object lifecycle in storage buckets.
    CompressRequest:
      properties:
        sourcePath:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcepath
          example: /home/user/dir
          nullable: true
        targetPath:
          type: string
          title: Targetpath
          description: Target path of the compress operation
        account:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
          description: Name of the account in the scheduler
          nullable: true
        matchPattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Matchpattern
          description: Regex pattern to filter files to compress
          nullable: true
        dereference:
          type: boolean
          title: Dereference
          description: If set to `true`, it follows symbolic links and archive the
            files they point to instead of the links themselves.
          default: false
          nullable: false
        compression:
          $ref: '#/components/schemas/CompressionType'
          description: Defines the type of compression to be used. By default gzip
            is used.
          default: gzip
          nullable: false
      type: object
      required:
      - sourcePath
      - targetPath
      title: CompressRequest
      examples:
      - account: group
        compression: none
        dereference: 'true'
        matchPattern: '*./[ab].*\.txt'
        sourcePath: /home/user/dir
        targetPath: /home/user/file.tar.gz
    CompressResponse:
      properties:
        transferJob:
          $ref: '#/components/schemas/TransferJob'
      type: object
      required:
      - transferJob
      title: CompressResponse
    CompressionType:
      type: string
      enum:
      - none
      - bzip2
      - gzip
      - xz
      title: CompressionType
    ContentUnit:
      type: string
      enum:
      - lines
      - bytes
      title: ContentUnit
    CopyRequest:
      properties:
        sourcePath:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcepath
          example: /home/user/dir
          nullable: true
        targetPath:
          type: string
          title: Targetpath
          description: Target path of the copy operation
        account:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
          description: Name of the account in the scheduler
          nullable: true
        dereference:
          type: boolean
          title: Dereference
          description: If set to `true`, it follows symbolic links and copies the
            files they point to instead of the links themselves.
          default: false
          nullable: false
      type: object
      required:
      - sourcePath
      - targetPath
      title: CopyRequest
      examples:
      - account: group
        dereference: 'true'
        sourcePath: /home/user/dir/file.orig
        targetPath: /home/user/dir/file.new
    CopyResponse:
      properties:
        transferJob:
          $ref: '#/components/schemas/TransferJob'
